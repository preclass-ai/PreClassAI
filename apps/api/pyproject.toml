[project]
name = "preclass-api"
version = "0.1.0"
description = "PreClass AI backend (Source-to-Output Traceability)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.4",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "argon2-cffi>=23",
  "python-multipart>=0.0.33",
  "python-docx>=1.1",
  "pypdf>=7.1.1",
  "openpyxl>=3.1.5",
  "python-pptx>=1.0.2",
  "defusedxml>=0.7.1",
  "pdfplumber>=0.11.11",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "openapi-spec-validator>=0.7",
    "reportlab>=5.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["db: needs Postgres at TEST_DATABASE_URL (skipped when unreachable)"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608", "S603", "E501"]
"seed/**" = ["E731", "E501", "S105", "B023"]
"alembic/**" = ["S608"]
"app/generation/providers.py" = ["E501"]
"app/routers/**" = ["E501"]  # one-line dependency signatures

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
