services:
  postgres:
    image: postgres:16-alpine
    env_file: .env.staging
    networks: [internal]
    volumes:
      - postgres-staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    image: ghcr.io/preclass-ai/preclass-api:${IMAGE_TAG:?set IMAGE_TAG}
    env_file: .env.staging
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, edge]  # edge gives outbound access to the LLM provider
    restart: unless-stopped
  web:
    image: ghcr.io/preclass-ai/preclass-web:${IMAGE_TAG:?set IMAGE_TAG}
    env_file: .env.staging
    networks: [edge]
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    env_file: .env.staging
    depends_on: [api, web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    restart: unless-stopped

networks:
  internal:
    internal: true
  edge:

volumes:
  postgres-staging:
  caddy-data:
  caddy-config:
