name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject common secret files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env$|\.env\..*|.*\.(pem|key)$)' | grep -vE '(^|/)\.env\.example$' ; then
            echo 'Secret-like files are tracked.' >&2
            exit 1
          fi
      - name: Validate collaboration entrypoints
        shell: bash
        run: |
          set -euo pipefail
          test -s AGENTS.md
          test -s CLAUDE.md
          test -s GEMINI.md
          test -s .agents/README.md
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: preclass_test
          POSTGRES_USER: preclass
          POSTGRES_PASSWORD: preclass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U preclass -d preclass_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PYTHONUTF8: "1"
      TEST_DATABASE_URL: postgresql+asyncpg://preclass:preclass@localhost:5432/preclass_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy --strict app
      - run: uv run pytest
  app:
    # Enable after the application scaffold and lockfile are committed.
    # `hashFiles()` is not available in this job-level expression context.
    if: ${{ vars.APP_CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
